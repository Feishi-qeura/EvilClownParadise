[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
; 【Cook 安全】UnrealEditor-Cmd 也会加载 EditorPerProjectUserSettings 和 ModelContextProtocol 模块。
; 若在项目默认层自动启动服务，Cook 会尝试绑定同一个端口；端口被交互式编辑器或其他程序占用时，
; LogHttpListener 会记录 Error，即使资源已 Cook 完成，UAT 仍会将整次任务判定为 UnknownCookFailure。
; 因此项目默认关闭自动启动；需要 MCP 时只在交互式编辑器会话中手动启动，不能让打包命令进程启动监听器。
bAutoStartServer=False
ServerPortNumber=8000
ServerUrlPath=/mcp
bEnableToolSearch=True
