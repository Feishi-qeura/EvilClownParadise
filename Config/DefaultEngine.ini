; CoreRedirects 是迁移期临时手段：只允许"救活旧资产"，禁止当改名的补丁长期使用
; （历史上错误配置曾导致资产加载崩溃）。
; 清理流程（编辑器内）：打开引用了旧类名的资产 → 右键 Fix Up Redirectors → 重新保存 →
;   确认无 loadErrors 后删除对应行。my_struct→EcpTaskChase、ECPTaskCase→ECPTaskChase 两条
;   均属此类，处理完资产即可整段删除。
[CoreRedirects]
+ClassRedirects=(OldName="/Script/EvilClownParadise.my_struct",NewName="/Script/EvilClownParadise.EcpTaskChase")
+StructRedirects=(OldName="/Script/EvilClownParadise.ECPTaskCase",NewName="/Script/EvilClownParadise.ECPTaskChase")

