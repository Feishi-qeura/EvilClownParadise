[FilterPlugin]
; 【分发配置契约】BuildPlugin 默认不会把插件 Config 目录作为额外文件复制。
; 显式列出两个 FU 所有的 ini，确保 Win64 分发包启用插件后能取得可逆的 OSS 默认层和设置默认值。
; 不列出项目 DefaultEngine.ini：它始终属于项目，插件禁用后不应残留 FU 管理配置。
/Config/Engine.ini
/Config/DefaultFUOnlineSession.ini

; 【分发文档】使用者需要与代码同版的 Blueprint 接入、Steam 地域边界和诊断说明；
; 将 README 放入 BuildPlugin 包，避免只交付 DLL 后又要人工猜测配置。
/README.md
