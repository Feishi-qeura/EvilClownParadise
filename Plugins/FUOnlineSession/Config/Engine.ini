[OnlineSubsystem]
DefaultPlatformService=Null

[OnlineSubsystemSteam]
bEnabled=true
bUseSteamNetworking=false

; 【UE 5.8 配置归属】P2P 参数已从 OnlineSubsystemSteam 迁到 SocketSubsystemSteamIP。
; 本插件的游戏连接仍显式选择 SteamSocketsNetDriver；若项目或引擎同时加载兼容层，
; 在新节完整声明这些键可避免 packaged Win64 启动时报告 deprecated/missing 配置警告。
[SocketSubsystemSteamIP]
bAllowP2PPacketRelay=true
P2PConnectionTimeout=90.0
P2PCleanupTimeout=1.5
